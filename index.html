<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Estudos IA · O maior portal de estudos de desenvolvimento em IA</title>
<meta name="description" content="O maior portal de estudos de desenvolvimento em IA: cursos práticos com desafios reais.">
<link rel="icon" type="image/svg+xml" href="assets/icone.svg">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudos IA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>

<div class="demo-bar" id="demo-bar" hidden></div>
<header class="top">
  <div class="top-in">
    <button class="logo" data-act="cursos" aria-label="Ir para os cursos"><img class="logoimg" src="assets/icone.svg" alt=""><span class="brand"><span class="title" id="titulo">Portal de Estudos IA</span><span class="tagline">O maior portal de estudos de desenvolvimento em IA</span></span></button>
    <div class="pbar off" role="progressbar" aria-label="Progresso no curso" id="pb-wrap"><i id="pb"></i></div>
    <div class="plabel off" id="pl"></div>
    <button class="btn-tool off" id="btn-tool" data-act="tool" aria-label="Abrir Code Toolbox">🧰 <span class="tt">Code Toolbox</span></button>
    <a class="btn-tool btn-master" id="btn-master" href="admin.html" hidden aria-label="Abrir o Painel do Master">🛡️ <span class="tt">Painel do Master</span></a>
    <button class="btn-tool btn-sair" id="btn-sair" type="button" data-act="sair" hidden aria-label="Sair do portal">🚪 <span class="tt">Sair</span></button>
  </div>
</header>

<div class="ov" id="ov" data-act="menu"></div>
<button class="sbz" type="button" data-act="menu" aria-label="Abrir o painel da trilha"><span>☰ Trilha</span></button>

<div class="app full" id="app">
  <aside class="sb" id="sb" aria-label="Módulos e lições"></aside>
  <main class="main" id="main"><div class="empty">Carregando…</div></main>
</div>

<nav class="bn" aria-label="Navegação">
  <button data-act="cursos" id="bn-cursos"><span>🎓</span>Cursos</button>
  <button data-act="home" id="bn-home" class="off"><span>🏠</span>Início</button>
  <button data-act="menu" id="bn-menu" class="off"><span>📚</span>Lições</button>
  <button data-act="tool" id="bn-tool" class="off"><span>🧰</span>Toolbox</button>
</nav>

<div class="shade" id="shade" data-act="toolclose"></div>
<aside class="drawer" id="drawer" aria-label="Code Toolbox"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="assets/cursos.js"></script>
<script src="assets/dados.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
